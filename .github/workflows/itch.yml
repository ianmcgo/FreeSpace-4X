name: Publish to itch.io
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  butler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage build
        run: |
          mkdir dist
          cp index.html dist/
          if [ -d images ]; then cp -r images dist/; fi
          echo "VERSION=$(grep -o "GAME_VERSION = '[^']*'" index.html | head -1 | cut -d"'" -f2)" >> "$GITHUB_ENV"
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
      - name: Push
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler push dist "${{ vars.ITCH_TARGET }}" --userversion "$VERSION"
